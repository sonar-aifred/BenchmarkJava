name: Build, Scan and Publish

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Set to 'true' to push the image to Artifactory (disabled for now; image is only built).
  PUSH_IMAGE: 'false'
  # Sonar internal Artifactory (repox). Override via repository variables if needed.
  DOCKER_REGISTRY: ${{ vars.ARTIFACTORY_DOCKER_REGISTRY || 'repox.jfrog.io' }}
  # Docker repository key + image name inside Artifactory, e.g. sonarsource-docker-dev/benchmark-java
  DOCKER_IMAGE: ${{ vars.ARTIFACTORY_DOCKER_IMAGE || 'sonarsource-docker-dev/benchmark-java' }}

jobs:
  build-test-scan:
    name: Build, test and SonarQube scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for accurate blame and new code detection

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: zulu
          cache: maven

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Disable build-time extension
        # .mvn/extensions.xml loads co.leantechniques:maven-buildtime-extension, which only prints
        # timings. Skipping it keeps CI from failing when that extension can't be resolved.
        run: rm -f .mvn/extensions.xml

      - name: Check formatting
        run: mvn --batch-mode --no-transfer-progress spotless:check

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify

      - name: SonarQube scan
        # Secrets are not exposed to fork PRs; skip the scan there.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          # Remaining settings live in sonar-project.properties.
          # A project-level sonar.exclusions replaces the server-wide default, which includes
          # **/generated-sources/**. The dummy pattern matches nothing, so nothing is excluded.
          # target/generated-sources is added to sonar.sources so it is actually analysed.
          # sonar.verbose=true switches the scanner to DEBUG logging (remove once debugging is done).
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.sources=src/main/java,src/main/webapp,target/generated-sources
            -Dsonar.exclusions=**/__no_exclusions__/**
            -Dsonar.verbose=true

      - name: SonarQube quality gate
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-war
          path: target/benchmark.war
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Containerise (push to Artifactory disabled)
    needs: build-test-scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: benchmark-war
          path: target

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Artifactory
        if: env.PUSH_IMAGE == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.ARTIFACTORY_USERNAME }}
          password: ${{ secrets.ARTIFACTORY_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image (push only outside pull requests)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUSH_IMAGE == 'true' && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
